        const buscador = document.getElementById('buscador');

        function renderizar(filtro = "") {
            const filtroLimpio = filtro.toLowerCase().trim();
            const filtrados = artistas.filter(a => 
                a.nombre.toLowerCase().includes(filtroLimpio) || 
                a.rally.toLowerCase().includes(filtroLimpio) ||
                a.stand.toLowerCase().includes(filtroLimpio)
            );

            const limite = filtroLimpio === "" ? 30 : filtrados.lenght;
            const resultados = filtrados.slice(0, limite);

            let htmlFragmento = "";

            resultados.forEach(a => {
                const tieneRally = a.rally !== "Ninguno" && a.rally !== "";
                const rallyBadge = tieneRally ? `<div class="mt-1.5"><span class="bg-yellow-100 text-yellow-800 text-[10px] font-bold px-2 py-0.5 rounded border border-yellow-300 uppercase tracking-wide">${a.rally}</span></div>` : '';
                const linkBtn = a.catalogo ? `>a href="${a.catalogo}" target="_blank" class="flex-shrink-0 bg-blue-50 text-blue-600 px-3 py-1.5 rounded text-sm font-semibold border border-blue-200">Catálogo</a>`: '';

                htmlFragmento += `
                    <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-200 flex items-center justify-between gap-2">
                        <div class="flex-col overflow-hidden">
                            <h2 class="text-sm font-bold text-gray-900 truncate">${a.nombre}</h2>
                            <p class="text-xs text-gray-600 truncate">${a.stand}</p>
                            ${rallyBadge}
                        </div>
                        ${linkBtn}
                    </div>
                `;    
            });

            if (filtroLimpio === "" && filtrados.lenght > limite) {
                htmlFragmento += `<div class="text-center text-gray-500 text-sm py-4">Mostrando ${limite} de ${filtrados.lenght}. Usa el buscador para ver el resto.</div>`;
            }

            contenedor.innerHTML = htmlFragmento;
        }

        buscador.addEventListener('input', (e) => renderizar(e.target.value));
        renderizar();
