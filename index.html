        const contenedor = document.getElementById('lista-artistas');
        const buscador = document.getElementById('buscador');

        function renderizar(filtro = "") {
            const filtroLimpio = filtro.toLowerCase().trim();
            const filtrados = artistas.filter(a => 
                a.nombre.toLowerCase().includes(filtroLimpio) || 
                a.rally.toLowerCase().includes(filtroLimpio) ||
                a.stand.toLowerCase().includes(filtroLimpio)
            );

            const limite = filtroLimpio === "" ? 30 : filtrados.length;
            const resultados = filtrados.slice(0, limite);

            let htmlFragmento = "";

            resultados.forEach(a => {
                const tieneRally = a.rally !== "Ninguno" && a.rally !== "";
                const rallyBadge = tieneRally ? `<div class="mt-2"><span class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full text-xs font-bold border border-amber-200">${a.rally}</span></div>` : '';
                
                let linkBtn = '';
                if (a.catalogo) {
                    const enlaces = a.catalogo.split(/[\s,]+/).filter(url => url.trim() !== "");

                    if (enlaces.length === 1) {
                        linkBtn = `<a href="${enlaces[0]}" target="_blank" class="block w-full text-center bg-blue-600 text-white font-semibold py-2.5 mt-3 rounded-lg active:bg-blue-700">Ir al Catálogo</a>`;
                    } else {
                        linkBtn = '<div class="flex gap-2 mt-3">';
                        enlaces.forEach((url, indice) => {
                            linkBtn += `<a href="${url}" target="_blank" class="block w-full text-center bg-blue-600 text-white font-semibold py-2.5 rounded-lg active:bg-blue-700">Catálogo ${indice + 1}</a>`;
                        });
                        linkBtn += '</div>';
                    }
                }

                htmlFragmento += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col">
                        <h2 class="text-lg font-bold text-gray-900 leading-tight">${a.nombre}</h2>
                        <p class="text-sm text-gray-600 mt-1">${a.stand}</p>
                        ${rallyBadge}
                        ${linkBtn}
                    </div>
                `;    
            });

            if (filtroLimpio === "" && filtrados.length > limite) {
                htmlFragmento += `<div class="text-center text-gray-500 text-sm py-4 font-medium">Mostrando ${limite} de ${filtrados.length}. Usa el buscador para ver el resto.</div>`;
            }

            contenedor.innerHTML = htmlFragmento;
        }

        buscador.addEventListener('input', (e) => renderizar(e.target.value));
        renderizar();
    </script>
